
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하레하레 레시피 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, push, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQXDALOHLjmeG-lDHQ4G-Gjo25m6DjqC4",
            authDomain: "hare-recipe.firebaseapp.com",
            databaseURL: "https://hare-recipe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hare-recipe",
            storageBucket: "hare-recipe.firebasestorage.app",
            messagingSenderId: "851727352160",
            appId: "1:851727352160:web:ade67411f1194e87011e05",
            measurementId: "G-9CTWDK42GX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.FB_DB = db;
        window.FB_Ref = ref;
        window.FB_OnValue = onValue;
        window.FB_Set = set;
        window.FB_Push = push;
        window.FB_Update = update;
        window.FB_Remove = remove;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-bread-slice text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900">하레하레 레시피</h1>
                    <p class="text-xs text-slate-500">실시간 공유 베이커리/카페 레시피 관리 시스템</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button onclick="openAddModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 새 레시피 추가
                </button>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> 엑셀 다운로드
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- 좌측: 카테고리 및 검색 -->
        <aside class="lg:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">레시피 검색</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="제품명, 재료 검색..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">카테고리</h2>
                <div id="categoryList" class="space-y-1"></div>
            </div>
        </aside>

        <!-- 우측: 레시피 목록 및 상세 뷰 -->
        <section class="lg:col-span-3 space-y-4">
            <div id="recipeContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>
    </main>

    <!-- 레시피 상세/수정/추가 통합 모달 -->
    <div id="recipeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900">레시피 상세 정보</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6 space-y-6"></div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let recipes = [];
        let currentCategory = '전체';
        let currentRecipeId = null;

        const categories = ['전체', '빵', '쿠키', '케이크', '소스', '기타'];

        window.addEventListener('firebase-ready', () => {
            initCategoryUI();
            loadRecipesFromFirebase();
        });

        function initCategoryUI() {
            const container = document.getElementById('categoryList');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" id="cat-btn-${cat}" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition ${cat === currentCategory ? 'bg-amber-50 text-amber-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                    ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            initCategoryUI();
            renderRecipes();
        }

        function loadRecipesFromFirebase() {
            const dbRef = window.FB_Ref(window.FB_DB, 'recipes');
            window.FB_OnValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    recipes = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                } else {
                    recipes = [];
                }
                renderRecipes();
            });
        }

        function renderRecipes() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('recipeContainer');

            const filtered = recipes.filter(r => {
                const matchCategory = currentCategory === '전체' || r.category === currentCategory;
                const matchKeyword = r.name.toLowerCase().includes(keyword) || (r.ingredients && r.ingredients.some(i => i.name.toLowerCase().includes(keyword)));
                return matchCategory && matchKeyword;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400 bg-white rounded-xl border border-slate-200">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium text-slate-600">등록된 레시피가 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">상단의 '새 레시피 추가' 버튼을 눌러 레시피를 직접 등록해보세요!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(r => `
                <div onclick="openRecipeModal('${r.id}')" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2.5 py-0.5 bg-amber-50 text-amber-700 text-xs font-semibold rounded-full">${r.category}</span>
                            <span class="text-xs text-slate-400">${r.yield || ''}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-900 mb-3">${r.name}</h3>
                        <div class="space-y-1 text-xs text-slate-600 mb-4">
                            ${(r.ingredients || []).slice(0, 3).map(i => `<div class="flex justify-between"><span>${i.name}</span><span class="font-medium">${i.amount}g</span></div>`).join('')}
                            ${(r.ingredients || []).length > 3 ? `<div class="text-slate-400 text-right">+외 ${r.ingredients.length - 3}개 재료</div>` : ''}
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                        <span>상세보기 및 수정</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </div>
                </div>
            `).join('');
        }

        function filterRecipes() {
            renderRecipes();
        }

        function openRecipeModal(id) {
            currentRecipeId = id;
            const r = recipes.find(item => item.id === id);
            if (!r) return;

            document.getElementById('modalTitle').innerText = r.name;
            document.getElementById('modalBody').innerHTML = `
                <div>
                    <span class="px-2.5 py-0.5 bg-amber-50 text-amber-700 text-xs font-semibold rounded-full">${r.category}</span>
                    <p class="text-xs text-slate-500 mt-2">생산 기준: <span class="font-medium text-slate-700">${r.yield || '기준 없음'}</span></p>
                </div>
                <div>
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">배합표 (재료)</h4>
                    <div class="bg-slate-50 rounded-lg p-3 space-y-1.5 border border-slate-100">
                        ${(r.ingredients || []).map(i => `<div class="flex justify-between text-sm"><span class="text-slate-700">${i.name}</span><span class="font-semibold text-slate-900">${i.amount}g</span></div>`).join('')}
                    </div>
                </div>
                <div>
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">제조 공정</h4>
                    <div class="bg-slate-50 rounded-lg p-3 text-sm text-slate-700 whitespace-pre-line border border-slate-100">${r.process || '공정 내용이 없습니다.'}</div>
                </div>
                <div class="flex justify-between pt-4 border-t border-slate-100">
                    <button onclick="deleteRecipe('${r.id}')" class="text-rose-600 hover:text-rose-700 text-sm font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-trash"></i> 삭제
                    </button>
                    <div class="flex gap-2">
                        <button onclick="openEditModal('${r.id}')" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                            <i class="fa-solid fa-pen"></i> 수정
                        </button>
                        <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition">
                            닫기
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function openAddModal() {
            currentRecipeId = null;
            document.getElementById('modalTitle').innerText = '새 레시피 추가';
            document.getElementById('modalBody').innerHTML = getRecipeFormHTML();
            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const r = recipes.find(item => item.id === id);
            if (!r) return;

            document.getElementById('modalTitle').innerText = '레시피 수정';
            document.getElementById('modalBody').innerHTML = getRecipeFormHTML(r);
            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function getRecipeFormHTML(r = {}) {
            const ingredientsText = (r.ingredients || []).map(i => `${i.name}:${i.amount}`).join('\n');
            return `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">제품명</label>
                        <input type="text" id="formName" value="${r.name || ''}" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="예: 소금빵">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">카테고리</label>
                        <select id="formCategory" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            ${categories.filter(c => c !== '전체').map(c => `<option value="${c}" ${r.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">생산 기준 (수량/배합)</label>
                        <input type="text" id="formYield" value="${r.yield || ''}" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="예: 20개 분량">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">재료 (이름:용량(g) 형식으로 줄바꿈 입력)</label>
                        <textarea id="formIngredients" rows="4" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="강력분:1000&#10;설탕:100">${ingredientsText}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">제조 공정</label>
                        <textarea id="formProcess" rows="4" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="1. 반죽하기&#10;2. 휴지하기">${r.process || ''}</textarea>
                    </div>
                    <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
                        <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium">취소</button>
                        <button onclick="saveRecipeData()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm font-medium">저장하기</button>
                    </div>
                </div>
            `;
        }

        function saveRecipeData() {
            const name = document.getElementById('formName').value.trim();
            const category = document.getElementById('formCategory').value;
            const yieldText = document.getElementById('formYield').value.trim();
            const rawIngredients = document.getElementById('formIngredients').value.trim();
            const process = document.getElementById('formProcess').value.trim();

            if (!name) {
                alert('제품명을 입력해주세요.');
                return;
            }

            const ingredients = rawIngredients.split('\n').map(line => {
                const parts = line.split(':');
                if (parts.length === 2) {
                    return { name: parts[0].trim(), amount: Number(parts[1].trim()) || 0 };
                }
                return null;
            }).filter(i => i !== null);

            const recipeData = { name, category, yield: yieldText, ingredients, process };

            if (currentRecipeId) {
                const recipeRef = window.FB_Ref(window.FB_DB, `recipes/${currentRecipeId}`);
                window.FB_Set(recipeRef, recipeData).then(() => {
                    closeModal();
                });
            } else {
                const newRef = window.FB_Push(window.FB_Ref(window.FB_DB, 'recipes'));
                window.FB_Set(newRef, recipeData).then(() => {
                    closeModal();
                });
            }
        }

        function deleteRecipe(id) {
            if (confirm('정말 이 레시피를 삭제하시겠습니까?')) {
                window.FB_Remove(window.FB_Ref(window.FB_DB, `recipes/${id}`)).then(() => {
                    closeModal();
                });
            }
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.add('hidden');
        }

        function exportToExcel() {
            if (recipes.length === 0) {
                alert('내보낼 레시피가 없습니다.');
                return;
            }
            const data = recipes.map(r => ({
                카테고리: r.category,
                제품명: r.name,
                생산기준: r.yield,
                재료: (r.ingredients || []).map(i => `${i.name}(${i.amount}g)`).join(', '),
                공정: r.process
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "레시피목록");
            XLSX.writeFile(wb, "하레하레_레시피.xlsx");
        }
    </script>
</body>
</html>
