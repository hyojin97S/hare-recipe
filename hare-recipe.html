<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하레하레 레시피</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg:#F6EFE1;
  --card:#FFFCF4;
  --ink:#3A2C1D;
  --ink-soft:#8C7A62;
  --ink-faint:#BFAE8E;
  --accent:#9C5F2E;
  --accent-dark:#743F1B;
  --accent-soft:#F0DFC0;
  --danger:#B34438;
  --danger-soft:#FBEAE7;
  --ok:#6B7C4E;
  --ok-soft:#EEF1E6;
  --line:#E6D6B8;
  --line-soft:#F0E5CD;
  --shadow: 0 1px 2px rgba(58,44,29,0.05), 0 8px 20px -10px rgba(58,44,29,0.20);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{ font-family:'JetBrains Mono', monospace; }
button{ font-family:inherit; cursor:pointer; }
input, textarea{ font-family:inherit; }

.shell{ max-width:900px; margin:0 auto; padding:32px 20px 90px; }

/* ---------- header & logo (클릭 가능) ---------- */
.brandbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:12px; }
.logo{ display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; transition:opacity 0.2s; }
.logo:hover{ opacity:0.8; }
.logo .emoji{ font-size:26px; line-height:1; }
.logo .words{ display:flex; flex-direction:column; gap:1px; }
.logo .kr{ display:flex; align-items:baseline; gap:8px; }
.logo .word1{ font-size:22px; font-weight:800; color:var(--ink); letter-spacing:-0.01em; }
.logo .word2{ font-size:22px; font-weight:500; color:var(--accent); letter-spacing:-0.01em; }
.logo .en{ font-size:10.5px; font-weight:700; letter-spacing:0.16em; color:var(--ink-faint); text-transform:uppercase; }

.backbtn{
  border:none; background:none; color:var(--ink-soft); font-size:14px; font-weight:600;
  display:flex; align-items:center; gap:5px; padding:8px 0; margin-bottom:14px;
}
.backbtn:hover{ color:var(--accent-dark); }

/* ---------- main category grid (네모칸 메뉴) ---------- */
.cat-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
  gap:12px; margin-bottom:20px;
}
.cat-card{
  background:var(--card); border:2px solid var(--line); border-radius:14px;
  padding:16px 12px; text-align:center; box-shadow:var(--shadow);
  transition:all 0.2s ease; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px;
}
.cat-card:hover{
  border-color:var(--accent); transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(156,95,46,0.15);
}
.cat-card.active{
  background:var(--accent); border-color:var(--accent); color:#fff;
}
.cat-card .icon{ font-size:24px; line-height:1; }
.cat-card .title{ font-size:15px; font-weight:800; }
.cat-card .count{ font-size:11.5px; font-weight:600; opacity:0.8; }
.cat-card.active .count{ color:#fff; }

/* ---------- search ---------- */
.searchwrap{ position:relative; margin-bottom:16px; }
.searchwrap input{
  width:100%; padding:13px 16px 13px 42px; border-radius:10px;
  border:1px solid var(--line); background:var(--card);
  font-size:15px; color:var(--ink); outline:none;
}
.searchwrap input:focus{ border-color:var(--accent); }
.searchwrap .icon{ position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:15px; }
.searchwrap input::placeholder{ color:var(--ink-faint); }

.catpicker{ display:flex; gap:7px; margin:2px 0 4px; flex-wrap:wrap; }
.catpicker button{
  border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  padding:6px 13px; border-radius:16px; font-size:12.5px; font-weight:700;
}
.catpicker button:hover{ border-color:var(--accent); color:var(--accent-dark); }
.catpicker button.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); }

/* ---------- list ---------- */
.listcard{
  display:flex; border:1px solid var(--line); border-radius:14px;
  background:var(--card); box-shadow:var(--shadow); overflow:hidden; height:520px;
}
.tabindex{
  width:34px; flex:none; background:var(--line-soft); border-right:1px solid var(--line);
  overflow-y:auto; padding:6px 0; scrollbar-width:none;
}
.tabindex::-webkit-scrollbar{ display:none; }
.tabindex button{
  display:block; width:100%; border:none; background:none; padding:6px 0;
  text-align:center; font-weight:700; font-size:11.5px; color:var(--ink-faint);
}
.tabindex button:hover{ color:var(--accent-dark); }

.listbody{ flex:1; overflow-y:auto; padding:4px 0; }
.group-heading{
  position:sticky; top:0; background:var(--card); padding:11px 20px 4px;
  font-weight:700; font-size:11.5px; letter-spacing:0.06em; color:var(--accent);
}
.recipe-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 20px; border-bottom:1px solid var(--line-soft); }
.recipe-row:hover{ background:var(--line-soft); }
.recipe-row button.rowbtn{ all:unset; cursor:pointer; font-size:15px; font-weight:600; color:var(--ink); flex:1; }
.recipe-row .arrow{ color:var(--ink-faint); font-size:14px; margin-left:10px; }
.empty-state{ padding:60px 30px; text-align:center; color:var(--ink-faint); font-size:14px; line-height:1.7; }

/* ---------- buttons ---------- */
.addbar{ display:flex; justify-content:center; gap:10px; margin-top:22px; }
.btn{
  border-radius:9px; border:1px solid transparent; padding:11px 18px; font-size:14px; font-weight:700;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.btn-primary{ background:var(--accent); color:#fff; }
.btn-primary:hover{ background:var(--accent-dark); }
.btn-ghost{ background:var(--card); border-color:var(--line); color:var(--ink-soft); }
.btn-ghost:hover{ border-color:var(--accent); color:var(--accent-dark); }
.btn-ok{ background:var(--ok); color:#fff; }
.btn-ok:hover{ background:#4C6841; }
.btn-danger{ background:transparent; color:var(--danger); border-color:#E8CFC9; }
.btn-danger:hover{ background:var(--danger-soft); }
.btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:7px; }

/* ---------- detail & view mode ---------- */
.detailhead{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:10px; }
.titlewrap{ flex:1; }
.productname-view{ font-weight:800; font-size:26px; color:var(--ink); margin:4px 0 8px; }
.category-badge{ display:inline-block; padding:4px 10px; background:var(--accent-soft); color:var(--accent-dark); border-radius:12px; font-size:12px; font-weight:700; }
.productname{
  width:100%; border:none; background:none; font-weight:800; font-size:26px; color:var(--ink);
  padding:6px 2px; outline:none; border-bottom:2px solid transparent; border-radius:4px;
}
.productname:focus{ border-bottom:2px solid var(--accent); }
.productname::placeholder{ color:var(--ink-faint); font-weight:500; }
.fieldlabel{ font-size:11.5px; font-weight:700; color:var(--ink-faint); letter-spacing:0.04em; padding:0 2px; }

.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:22px 22px 24px; margin-top:18px; }
.card h2{ font-size:15px; font-weight:700; margin:0 0 14px; color:var(--ink); display:flex; align-items:center; justify-content:space-between; gap:10px; }
.card h2 .tag{ font-size:11px; color:var(--ink-faint); font-weight:500; }
.card h2 .h2actions{ display:flex; gap:8px; }

/* Readonly Table Styles */
.view-table-wrap{ overflow-x:auto; border-radius:10px; border:1px solid var(--line-soft); }
table.view-spec{ width:100%; border-collapse:collapse; min-width:480px; }
table.view-spec th, table.view-spec td{ padding:10px 12px; text-align:left; border-bottom:1px solid var(--line-soft); font-size:14px; }
table.view-spec th{ background:var(--line-soft); color:var(--ink); font-weight:700; }
table.view-spec td.amtcol{ font-family:'JetBrains Mono', monospace; font-weight:600; color:var(--accent-dark); text-align:right; }
table.view-spec td.notecol{ color:var(--ink-soft); font-size:13px; }

/* Readonly Lists */
.view-list{ display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none; }
.view-list li{ display:flex; gap:10px; font-size:14.5px; line-height:1.6; color:var(--ink); background:#FDFCF9; padding:10px 14px; border-radius:8px; border:1px solid var(--line-soft); }
.view-list li .num{ font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--accent); flex:none; }

/* ---------- Editable Table ---------- */
.tablewrap{ overflow-x:auto; border-radius:10px; border:1px solid var(--line-soft); }
table.spec{ width:100%; border-collapse:collapse; min-width:520px; }
table.spec thead th{ background:var(--line-soft); color:var(--ink); font-size:12.5px; font-weight:700; padding:10px; border-bottom:1.5px solid var(--line); text-align:left; white-space:nowrap; }
table.spec thead th.namecol{ position:sticky; left:0; background:var(--line-soft); z-index:2; min-width:150px; }
table.spec tbody td{ padding:6px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
table.spec tbody td.namecol{ position:sticky; left:0; background:var(--card); z-index:1; min-width:150px; }
table.spec tbody tr:hover td{ background:#FBF9F4; }
table.spec tbody tr:hover td.namecol{ background:#FBF9F4; }
table.spec input.cellname{ border:none; background:none; width:100%; font-size:14.5px; font-weight:600; color:var(--ink); padding:5px 4px; outline:none; border-radius:5px; }
table.spec input.cellname:focus{ background:var(--accent-soft); }
table.spec .amtwrap{ display:flex; align-items:center; gap:3px; }
table.spec input.cellamt{ border:1px solid var(--line); background:#FDFCF9; width:86px; font-family:'JetBrains Mono', monospace; font-size:13.5px; padding:5px 6px; border-radius:6px; outline:none; text-align:right; }
table.spec input.cellamt:focus{ border-color:var(--accent); }
table.spec .gsuffix{ color:var(--ink-faint); font-size:12px; }
table.spec input.cellnote{ border:none; background:none; width:100%; min-width:90px; font-size:13px; color:var(--ink-soft); padding:5px 4px; outline:none; border-radius:5px; }
table.spec input.cellnote:focus{ background:var(--accent-soft); }
table.spec th input.stdname{ background:#FDFCF9; border:1px solid var(--line); border-radius:6px; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12.5px; padding:5px 7px; width:82px; outline:none; color:var(--accent-dark); text-align:center; }
table.spec th input.stdname::placeholder{ color:var(--ink-faint); font-weight:500; }
table.spec th input.stdname:focus{ border-color:var(--accent); }
.stdhead{ display:flex; align-items:center; gap:5px; }
.colremove{ all:unset; cursor:pointer; color:var(--ink-faint); font-size:13px; width:16px; height:16px; text-align:center; line-height:16px; border-radius:50%; flex:none; }
.colremove:hover{ color:var(--danger); background:var(--danger-soft); }
.rowremove{ all:unset; cursor:pointer; color:var(--ink-faint); font-size:14px; padding:2px 6px; border-radius:5px; }
.rowremove:hover{ color:var(--danger); background:var(--danger-soft); }
.tableaddrow{ display:flex; gap:8px; margin-top:12px; }

/* ---------- prep / process lists ---------- */
.itemlist{ display:flex; flex-direction:column; gap:8px; }
.item-row{ display:flex; align-items:flex-start; gap:9px; }
.item-row .bullet{ flex:none; width:24px; height:24px; border-radius:50%; background:var(--line-soft); color:var(--accent-dark); font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11.5px; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.item-row textarea{ flex:1; border:1px solid var(--line); background:#FDFCF9; border-radius:8px; padding:8px 10px; font-size:14px; line-height:1.55; color:var(--ink); resize:vertical; min-height:38px; outline:none; }
.item-row textarea:focus{ border-color:var(--accent); }
.item-remove{ all:unset; cursor:pointer; color:var(--ink-faint); font-size:14px; padding:5px 7px; margin-top:2px; border-radius:6px; }
.item-remove:hover{ color:var(--danger); background:var(--danger-soft); }
.additem{ margin-top:10px; }

.bottomactions{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:10px; flex-wrap:wrap; }
.bottomactions .left, .bottomactions .right{ display:flex; gap:8px; flex-wrap:wrap; }

.savetoast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#FBF8F2; padding:11px 20px; border-radius:9px;
  font-size:13.5px; font-weight:600; box-shadow:0 10px 24px -8px rgba(0,0,0,.4);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50; max-width:90vw; text-align:center;
}
.savetoast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:640px){
  .shell{ padding:20px 12px 80px; }
  .logo .word1, .logo .word2{ font-size:20px; }
  .cat-grid{ grid-template-columns:repeat(2, 1fr); }
  .listcard{ height:460px; }
  .productname, .productname-view{ font-size:22px; }
  .card{ padding:16px 14px 18px; }
  .bottomactions{ flex-direction:column; align-items:stretch; }
  .bottomactions .left, .bottomactions .right{ justify-content:center; }
}
</style>
</head>

/* ============ 천단위 쉼표 포맷팅 헬퍼 ============ */
function formatAmount(val) {
  if (val === null || val === undefined || val === '') return '';
  const str = String(val).trim();
  if (!isNaN(str) && str !== '') {
    const parts = str.split('.');
    parts[0] = Number(parts[0]).toLocaleString('ko-KR');
    return parts.join('.');
  }
  return str.replace(/\d+/g, m => Number(m).toLocaleString('ko-KR'));
}

/* ============ 상태 관리 및 데이터 로드 ============ */
const STORE_KEY = 'harehare_recipes_v3';
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CATEGORIES = ['빵','쿠키','케이크','소스'];
const CAT_ICONS = { '전체': '📋', '빵': '🍞', '쿠키': '🍪', '케이크': '🍰', '소스': '🍯' };

function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) {
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  }catch(e){}
  saveData(INITIAL_DATA);
  return INITIAL_DATA;
}
function saveData(data){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

let DATA = loadData();
let VIEW = { page:'home', recipeId:null, mode:'view', search:'', category:'all' };

/* ============ 유틸 함수 ============ */
function getCho(str){
  if(!str) return '#';
  const c = str.charCodeAt(0);
  if(isNaN(c) || c < 0xAC00 || c > 0xD7A3) return '#';
  return CHO[Math.floor((c-0xAC00)/588)];
}
function sortedRecipes(list){ return [...list].sort((a,b)=> a.name.localeCompare(b.name,'ko')); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 1800);
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function findRecipe(id){ return DATA.find(r=>r.id===id); }
function persist(){ saveData(DATA); }
function currentRecipe(){ return findRecipe(VIEW.recipeId); }

/* ============ 공통 상단 로고 HTML 생성 ============ */
function getBrandBarHtml(){
  return `
    <div class="brandbar">
      <div class="logo" onclick="goHome()" title="메인 화면으로 이동">
        <span class="emoji">🍞</span>
        <div class="words">
          <div class="kr"><span class="word1">하레하레</span><span class="word2">레시피</span></div>
          <div class="en">Harehare Recipe</div>
        </div>
      </div>
    </div>
  `;
}

/* ============ 홈 화면 ============ */
function renderHome(){
  const shell = document.getElementById('shell');
  shell.innerHTML = `
    ${getBrandBarHtml()}

    <!-- 네모칸 카테고리 그리드 메뉴 -->
    <div class="cat-grid" id="catGrid"></div>

    <div class="searchwrap">
      <span class="icon">⌕</span>
      <input id="searchInput" type="text" placeholder="제품명으로 검색" value="${escapeHtml(VIEW.search)}"
        oninput="VIEW.search=this.value; updateList();">
    </div>

    <div class="listcard">
      <div class="tabindex" id="tabIndex"></div>
      <div class="listbody" id="listbody"></div>
    </div>

    <div class="addbar">
      <button class="btn btn-primary" onclick="newRecipe()">＋ 새 레시피 추가</button>
    </div>
  `;
  renderCatGrid();
  updateList();
}

function renderCatGrid(){
  const items = [{key:'all', label:'전체'}, ...CATEGORIES.map(c=>({key:c, label:c}))];
  document.getElementById('catGrid').innerHTML = items.map(c=>{
    const count = c.key === 'all' 
      ? DATA.length 
      : DATA.filter(r => r.category === c.key).length;
    const icon = CAT_ICONS[c.label] || '📄';
    const isActive = VIEW.category === c.key ? 'active' : '';

    return `
      <div class="cat-card ${isActive}" onclick="setCategory('${c.key}')">
        <div class="icon">${icon}</div>
        <div class="title">${c.label}</div>
        <div class="count">${count}개의 레시피</div>
      </div>
    `;
  }).join('');
}

function setCategory(cat){
  VIEW.category = cat;
  renderCatGrid();
  updateList();
}

function updateList(){
  const q = VIEW.search.trim();
  let list = sortedRecipes(DATA);
  if(q) list = list.filter(r=> r.name.toLowerCase().includes(q.toLowerCase()));
  if(VIEW.category !== 'all') list = list.filter(r=> r.category === VIEW.category);

  const groups = {};
  list.forEach(r=>{ const k=getCho(r.name); (groups[k] ||= []).push(r); });
  const groupKeys = Object.keys(groups).sort();

  let listHtml = '';
  if(list.length===0){
    const msg = (q || VIEW.category!=='all') ? '조건에 맞는 레시피가 없어요.' : '아직 등록된 레시피가 없어요.<br>아래 "새 레시피 추가" 버튼으로 시작해보세요.';
    listHtml = `<div class="empty-state">${msg}</div>`;
  }else{
    groupKeys.forEach(k=>{
      const gid = k==='#' ? 'hash' : k;
      listHtml += `<div class="group-heading" id="grp-${gid}">${k}</div>`;
      groups[k].forEach(r=>{
        listHtml += `
          <div class="recipe-row">
            <button class="rowbtn" onclick="openRecipe('${r.id}')">${r.name ? escapeHtml(r.name) : '(제품명 미입력)'}</button>
            <span class="arrow">›</span>
          </div>`;
      });
    });
  }
  document.getElementById('listbody').innerHTML = listHtml;
  document.getElementById('tabIndex').innerHTML = groupKeys.map(k=>{
    const target = k==='#' ? 'hash' : k;
    return `<button onclick="scrollToGroup('${target}')">${k}</button>`;
  }).join('');
}
function scrollToGroup(k){
  const el = document.getElementById('grp-'+k);
  if(el) el.scrollIntoView({block:'start'});
}

/* ============ 레시피 상세보기 & 편집 연결 ============ */
function openRecipe(id){ VIEW.page='detail'; VIEW.recipeId=id; VIEW.mode='view'; renderDetail(); }
function newRecipe(){
  const cat = CATEGORIES.includes(VIEW.category) ? VIEW.category : CATEGORIES[0];
  const r = { id: uid(), name:'', category:cat, standards:[{id:uid(), name:''}], ingredients:[], prep:[], steps:[] };
  DATA.push(r); persist();
  VIEW.page='detail'; VIEW.recipeId=r.id; VIEW.mode='edit';
  renderDetail();
}
function goHome(){ VIEW.page='home'; VIEW.recipeId=null; renderHome(); }
function switchMode(mode){ VIEW.mode = mode; renderDetail(); }

/* ============ 레시피 상세/편집 메인 렌더러 ============ */
function renderDetail(){
  const r = findRecipe(VIEW.recipeId);
  if(!r){ goHome(); return; }

  if(VIEW.mode === 'view') {
    renderViewMode(r);
  } else {
    renderEditMode(r);
  }
}

    </div>

    <div class="card">
      <h2>제조공정 <span class="tag">순서대로 진행</span></h2>
      <ul class="view-list">
        ${stepsHtml || `<li style="color:var(--ink-faint);">제조 공정이 없습니다.</li>`}
      </ul>
    </div>

    <div class="bottomactions" style="justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="downloadExcel()">⬇ 엑셀 다운로드</button>
    </div>
  `;
}

/* ------------ 2. 수정/편집 모드 화면 ------------ */
function renderEditMode(r){
  const shell = document.getElementById('shell');

  const stdHeaders = r.standards.map(s=>`
    <th>
      <div class="stdhead">
        <input class="stdname mono" placeholder="예: 1개" value="${escapeHtml(s.name)}"
          oninput="updateStdName('${s.id}', this.value)">
        <button class="colremove" title="이 배합 기준 삭제" onclick="removeStd('${s.id}')">✕</button>
      </div>
    </th>`).join('');

  const rows = r.ingredients.map(ing=>`
    <tr>
      <td class="namecol">
        <input class="cellname" value="${escapeHtml(ing.name)}" placeholder="재료명"
          oninput="updateIngName('${ing.id}', this.value)">
      </td>
      ${r.standards.map(s=>`
        <td>
          <div class="amtwrap">
            <input class="cellamt" placeholder="0" value="${escapeHtml(ing.amounts?.[s.id] ?? '')}"
              oninput="updateAmount('${ing.id}','${s.id}', this.value)">
            <span class="gsuffix">g</span>
          </div>
        </td>`).join('')}
      <td>
        <input class="cellnote" value="${escapeHtml(ing.note||'')}" placeholder="비고"
          oninput="updateIngNote('${ing.id}', this.value)">
      </td>
      <td><button class="rowremove" title="재료 삭제" onclick="removeIngredient('${ing.id}')">✕</button></td>
    </tr>`).join('');

  const prepHtml = r.prep.map((p,i)=>`
    <div class="item-row">
      <div class="bullet">•</div>
      <textarea rows="1" oninput="autoGrow(this); updatePrep(${i}, this.value)">${escapeHtml(p)}</textarea>
      <button class="item-remove" onclick="removePrep(${i})">✕</button>
    </div>`).join('');

  const stepsHtml = r.steps.map((s,i)=>`
    <div class="item-row">
      <div class="bullet mono">${i+1}</div>
      <textarea rows="1" oninput="autoGrow(this); updateStep(${i}, this.value)">${escapeHtml(s)}</textarea>
      <button class="item-remove" onclick="removeStep(${i})">✕</button>
    </div>`).join('');

  const catPickerHtml = CATEGORIES.map(c=>
    `<button class="${r.category===c?'active':''}" onclick="setRecipeCategory('${c}')">${c}</button>`
  ).join('');

  shell.innerHTML = `
    ${getBrandBarHtml()}

    <button class="backbtn" onclick="switchMode('view')">‹ 상세보기 모드로 돌아가기</button>

    <div class="detailhead">
      <div class="titlewrap">
        <div class="fieldlabel">제품명</div>
        <input class="productname" placeholder="제품명을 입력하세요" value="${escapeHtml(r.name)}" oninput="updateName(this.value)">
        <div class="fieldlabel" style="margin-top:10px;">분류 선택</div>
        <div class="catpicker">${catPickerHtml}</div>
      </div>
    </div>

    <div class="card">
      <h2>배합표 <div class="h2actions">
        <button class="btn btn-ghost btn-sm" onclick="addStandard()">＋ 배합 추가</button>
      </div></h2>
      <div class="tablewrap">
        <table class="spec">
          <thead>
            <tr>
              <th class="namecol">재료명</th>
              ${stdHeaders}
              <th>비고</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="${r.standards.length+3}" style="padding:20px;color:var(--ink-faint);">아직 재료가 없어요. 아래에서 추가해보세요.</td></tr>`}</tbody>
        </table>
      </div>
      <div class="tableaddrow">
        <button class="btn btn-ghost btn-sm" onclick="addIngredient()">＋ 재료 추가</button>
      </div>
    </div>

    <div class="card">
      <h2>준비 <span class="tag">사전 준비사항</span></h2>
      <div class="itemlist">${prepHtml || `<div class="empty-state" style="padding:16px 4px;">준비 항목이 없어요.</div>`}</div>
      <div class="additem"><button class="btn btn-ghost btn-sm" onclick="addPrep()">＋ 준비 항목 추가</button></div>
    </div>

    <div class="card">
      <h2>제조공정 <span class="tag">순서대로 진행</span></h2>
      <div class="itemlist">${stepsHtml || `<div class="empty-state" style="padding:16px 4px;">공정 항목이 없어요.</div>`}</div>
      <div class="additem"><button class="btn btn-ghost btn-sm" onclick="addStep()">＋ 공정 추가</button></div>
    </div>

    <div class="bottomactions">
      <div class="left">
        <button class="btn btn-danger" onclick="deleteRecipe()">레시피 삭제</button>
      </div>
      <div class="right">
        <button class="btn btn-ok" onclick="manualSave()">완료 및 저장</button>
      </div>
    </div>
  `;
  shell.querySelectorAll('textarea').forEach(autoGrow);
}

function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; }

/* ---- 데이터 변경 헬퍼 ---- */
function updateName(v){ currentRecipe().name = v; persist(); }
function setRecipeCategory(cat){ currentRecipe().category = cat; persist(); renderDetail(); }
function updateStdName(stdId, v){
  const s = currentRecipe().standards.find(s=>s.id===stdId);
  if(s){ s.name = v; persist(); }
}
function addStandard(){ currentRecipe().standards.push({id: uid(), name:''}); persist(); renderDetail(); }
function removeStd(stdId){
  const r = currentRecipe();
  if(r.standards.length<=1){ toast('배합 기준은 최소 1개 이상 필요해요'); return; }
  r.standards = r.standards.filter(s=>s.id!==stdId);
  r.ingredients.forEach(ing=>{ if(ing.amounts) delete ing.amounts[stdId]; });
  persist(); renderDetail();
}
function addIngredient(){ currentRecipe().ingredients.push({ id: uid(), name:'', amounts:{}, note:'' }); persist(); renderDetail(); }
function removeIngredient(id){
  const r = currentRecipe();
  r.ingredients = r.ingredients.filter(i=>i.id!==id);
  persist(); renderDetail();
}
function updateIngName(id, v){ const ing = currentRecipe().ingredients.find(i=>i.id===id); if(ing){ ing.name=v; persist(); } }
function updateIngNote(id, v){ const ing = currentRecipe().ingredients.find(i=>i.id===id); if(ing){ ing.note=v; persist(); } }
function updateAmount(ingId, stdId, v){
  const ing = currentRecipe().ingredients.find(i=>i.id===ingId);
  if(ing){ if(!ing.amounts) ing.amounts={}; ing.amounts[stdId]=v; persist(); }
}
function addPrep(){ currentRecipe().prep.push(''); persist(); renderDetail(); }
function removePrep(i){ currentRecipe().prep.splice(i,1); persist(); renderDetail(); }
function updatePrep(i,v){ currentRecipe().prep[i]=v; persist(); }
function addStep(){ currentRecipe().steps.push(''); persist(); renderDetail(); }
function removeStep(i){ currentRecipe().steps.splice(i,1); persist(); renderDetail(); }
function updateStep(i,v){ currentRecipe().steps[i]=v; persist(); }

function manualSave(){ 
  persist(); 
  toast('저장되었습니다.'); 
  switchMode('view');
}

function deleteRecipe(){
  const r = currentRecipe();
  if(!confirm(`"${r.name}" 레시피를 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) return;
  DATA = DATA.filter(x=>x.id!==r.id);
  persist();
  goHome();
  toast('레시피가 삭제되었습니다.');
}

/* ---- 엑셀 다운로드 ---- */
function downloadExcel(){
  const r = currentRecipe();
  const aoa = [];
  aoa.push(['제품명', r.name]);
  aoa.push([]);
  aoa.push(['배합표']);
  aoa.push(['재료명', ...r.standards.map(s=>s.name||'(기준명 미입력)'), '비고']);
  r.ingredients.forEach(ing=>{
    aoa.push([ing.name, ...r.standards.map(s=> {
      const val = ing.amounts?.[s.id] ?? '';
      return val ? `${formatAmount(val)}${!isNaN(val.trim()) ? 'g' : ''}` : '';
    }), ing.note||'']);
  });
  aoa.push([]);
  aoa.push(['준비']);
  if(r.prep.length===0) aoa.push(['-']);
  r.prep.forEach(p=> aoa.push([p]));
  aoa.push([]);
  aoa.push(['제조공정']);
  if(r.steps.length===0) aoa.push(['-']);
  r.steps.forEach((s,i)=> aoa.push([`${i+1}. ${s}`]));

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:22}, ...r.standards.map(()=>({wch:12})), {wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (r.name || 'recipe').slice(0,28));
  XLSX.writeFile(wb, `${r.name || '레시피'}.xlsx`);
  toast('엑셀 파일을 다운로드했습니다.');
}

/* ============ 실행 ============ */
function render(){ if(VIEW.page==='home') renderHome(); else renderDetail(); }
render();
</script>
